name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and protocol tests (host architecture)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository whitespace
        run: git diff --check HEAD^ HEAD

      - name: Install dependencies
        run: brew install cmake pkg-config openssl@3 ffmpeg uriparser jansson

      - name: Cache private FreeRDP build
        uses: actions/cache@v6
        with:
          path: work/build-patched
          key: native-mac-rdp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build.sh', 'patches/*.patch', '.github/freerdp-version') }}

      - name: Build and test
        run: ./scripts/build.sh

      - name: Inspect executable dependencies
        run: |
          file work/build-patched/daemon-build/macos-rdp-daemon
          otool -L work/build-patched/daemon-build/macos-rdp-daemon

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: NativeMacRDP-${{ runner.arch }}
          path: |
            work/build-patched/daemon-build/macos-rdp-daemon
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/Apache-2.0.txt
          if-no-files-found: error
          retention-days: 14
